<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相棒のAI</title>
<style>
body{font-family:sans-serif;max-width:700px;margin:auto;padding:16px;background:#f4f6f8;color:#222}
h2{margin-bottom:8px}
textarea,input,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border-radius:8px;font-size:16px}
textarea{min-height:100px;border:1px solid #bbb}
input{border:1px solid #bbb}
button{border:0;background:#2563eb;color:white;font-weight:bold}
button:disabled{opacity:.5}
#chat{height:300px;overflow:auto;background:white;padding:12px;border-radius:10px;border:1px solid #ddd;white-space:pre-wrap}
.msg{padding:9px;margin:8px 0;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#dbeafe}
.ai{background:#eee}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h2>相棒のAI</h2>
<p id="status">準備中</p>

<button id="loadBtn">AIを起動する</button>

<h3>記憶</h3>
<p class="small">会話から覚えたことも、ここに追加されるよ。</p>
<textarea id="memory"></textarea>
<button id="saveMemory">記憶を保存</button>

<h3>会話</h3>
<div id="chat"></div>
<input id="question" placeholder="メッセージを入力">
<button id="sendBtn">送信</button>
<button id="clearBtn">会話を消去</button>

<script type="module">
import { CreateMLCEngine } from
"https://esm.run/@mlc-ai/web-llm";

const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";

const memoryBox = document.getElementById("memory");
const chatBox = document.getElementById("chat");
const statusBox = document.getElementById("status");
const loadBtn = document.getElementById("loadBtn");
const sendBtn = document.getElementById("sendBtn");
const questionBox = document.getElementById("question");

let engine = null;
let messages = [];

memoryBox.value = localStorage.getItem("myai-memory") || "";

function saveMemory() {
  localStorage.setItem("myai-memory", memoryBox.value);
}

document.getElementById("saveMemory").onclick = () => {
  saveMemory();
  statusBox.textContent = "記憶を保存したよ！";
};

function showMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "ai");
  div.textContent = (role === "user" ? "あなた：\n" : "AI：\n") + text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addMemory(text) {
  const oldMemory = memoryBox.value.trim();
  const line = "・" + text;

  if (oldMemory.includes(text)) return;

  memoryBox.value = oldMemory
    ? oldMemory + "\n" + line
    : "【ユーザーの記憶】\n" + line;

  saveMemory();
}

function learnFromMessage(text) {
  const t = text.trim();

  // 「覚えて」「記憶して」と頼まれた内容を保存
  const explicit = t.match(
    /(?:覚えて|記憶して|忘れないで)[、：:\s]*(.+)/
  );

  if (explicit && explicit[1].trim()) {
    addMemory(explicit[1].trim());
    return "覚えておくね！";
  }

  // 好きなものについての発言を記憶
  const favorite = t.match(
    /(?:俺|僕|私|自分)?(?:は|の)?好きな(食べ物|飲み物|色|動物|ゲーム|趣味)(?:は|が)?\s*(.+?)(?:です|だよ|だね|だ|！|。|！)?$/
  );

  if (favorite && favorite[2].trim()) {
    addMemory("好きな" + favorite[1] + "は" + favorite[2].trim());
    return "好きなものとして記憶に追加したよ！";
  }

  // 「ラーメンが好き」などの発言を記憶
  const likes = t.match(
    /(?:俺|僕|私|自分)?(?:は|が)?\s*(.+?)が好き(?:です|だよ|だね|だ)?[！。！]?$/
  );

  if (likes && likes[1].trim().length <= 40) {
    addMemory("好きなもの：" + likes[1].trim());
    return "好きなものとして記憶に追加したよ！";
  }

  return "";
}

loadBtn.onclick = async () => {
  if (engine) return;

  loadBtn.disabled = true;
  statusBox.textContent = "AIを起動中…初回は時間がかかるよ。";

  try {
    engine = await CreateMLCEngine(MODEL, {
      initProgressCallback: (p) => {
        statusBox.textContent =
          p.text || "AIを準備中…";
      }
    });

    statusBox.textContent = "AI起動完了！話しかけてね。";
    loadBtn.textContent = "AI起動済み";
  } catch (e) {
    statusBox.textContent = "起動失敗：" + e.message;
    loadBtn.disabled = false;
  }
};

async function sendMessage() {
  const text = questionBox.value.trim();
  if (!text) return;

  if (!engine) {
    statusBox.textContent = "先に「AIを起動する」を押してね。";
    return;
  }

  questionBox.value = "";
  sendBtn.disabled = true;
  showMessage("user", text);

  // 記憶について聞かれたら、保存内容を直接返す
  if (/保存されている記憶|保存した記憶|記憶を教えて|覚えていること/.test(text)) {
    const answer = memoryBox.value.trim() || "まだ記憶はないよ。";
    showMessage("assistant", answer);
    sendBtn.disabled = false;
    return;
  }

  // 会話から記憶を自動追加
  const learned = learnFromMessage(text);

  if (learned) {
    showMessage("assistant", learned);
    sendBtn.disabled = false;
    return;
  }

  try {
    const memory = memoryBox.value.trim();

    const systemPrompt =
      "あなたはユーザー専用の日本語AIです。" +
      "自然で分かりやすく、短めに回答してください。" +
      "必要に応じてユーザーを「相棒」と呼んでください。" +
      "操作案内は一度に一つずつ説明してください。" +
      "\n\n保存されている記憶：\n" +
      (memory || "まだ記憶はありません。");

    messages.push({ role: "user", content: text });

    const recentMessages = messages.slice(-10);

    const result = await engine.chat.completions.create({
      messages: [
        { role: "system", content: systemPrompt },
        ...recentMessages
      ],
      temperature: 0.7,
      max_tokens: 256
    });

    const answer =
      result.choices[0]?.message?.content || "うまく回答できなかったよ。";

    messages.push({ role: "assistant", content: answer });
    showMessage("assistant", answer);

  } catch (e) {
    showMessage("assistant", "エラーが発生したよ：" + e.message);
  }

  sendBtn.disabled = false;
}

sendBtn.onclick = sendMessage;

questionBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

document.getElementById("clearBtn").onclick = () => {
  messages = [];
  chatBox.replaceChildren();
  statusBox.textContent = "会話を消去したよ。記憶は残っているよ。";
};
</script>
</body>
</html>
