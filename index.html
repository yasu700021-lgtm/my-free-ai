<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相棒のAI</title>
<style>
body{font-family:sans-serif;max-width:700px;margin:auto;padding:16px;background:#f4f6f8;color:#222}
textarea,input,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border-radius:8px;font-size:16px}
textarea{min-height:110px;border:1px solid #bbb}
input{border:1px solid #bbb}
button{border:0;background:#2563eb;color:white;font-weight:bold}
button:disabled{opacity:.5}
#chat{height:300px;overflow:auto;background:white;padding:12px;border-radius:10px;border:1px solid #ddd;white-space:pre-wrap}
.msg{padding:9px;margin:8px 0;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#dbeafe}
.ai{background:#eee}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<h2>相棒のAI</h2>
<p id="status">準備完了</p>
<button id="loadBtn">AIを起動する</button>

<h3>記憶</h3>
<p class="small">会話から自動で追加・変更・削除できるよ。</p>
<textarea id="memory"></textarea>
<button id="saveMemory">記憶を保存</button>

<h3>会話履歴</h3>
<div id="chat"></div>
<input id="question" placeholder="メッセージを入力">
<button id="sendBtn">送信</button>
<button id="clearBtn">会話履歴を消去</button>

<script type="module">
import { CreateMLCEngine } from
"https://esm.run/@mlc-ai/web-llm";

const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";

const memoryBox = document.getElementById("memory");
const chatBox = document.getElementById("chat");
const statusBox = document.getElementById("status");
const loadBtn = document.getElementById("loadBtn");
const sendBtn = document.getElementById("sendBtn");
const questionBox = document.getElementById("question");

let engine = null;
let messages = [];

memoryBox.value = localStorage.getItem("myai-memory") || "";

try {
  messages = JSON.parse(
    localStorage.getItem("myai-history") || "[]"
  );
  if (!Array.isArray(messages)) messages = [];
} catch {
  messages = [];
}

function saveMemory() {
  localStorage.setItem("myai-memory", memoryBox.value);
}

function saveHistory() {
  localStorage.setItem("myai-history", JSON.stringify(messages));
}

function showMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "ai");
  div.textContent =
    (role === "user" ? "あなた：\n" : "AI：\n") + text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// 保存済みの会話を画面に復元
messages.forEach(message => {
  if (message.role === "user" || message.role === "assistant") {
    showMessage(message.role, message.content);
  }
});

document.getElementById("saveMemory").onclick = () => {
  saveMemory();
  statusBox.textContent = "記憶を保存したよ！";
};

function changeMemory(oldText, newText) {
  const lines = memoryBox.value.split("\n");
  let changed = false;

  const updated = lines.map(line => {
    if (!changed && line.includes(oldText)) {
      changed = true;
      return line.replace(oldText, newText);
    }
    return line;
  });

  if (!changed) {
    return "「" + oldText + "」に一致する記憶が見つからなかったよ。";
  }

  memoryBox.value = updated.join("\n");
  saveMemory();
  return "記憶を「" + newText + "」に変更したよ！";
}

function deleteMemory(keyword) {
  const lines = memoryBox.value.split("\n");
  const kept = lines.filter(line => !line.includes(keyword));

  if (kept.length === lines.length) {
    return "「" + keyword + "」に一致する記憶が見つからなかったよ。";
  }

  memoryBox.value = kept.join("\n");
  saveMemory();
  return "「" + keyword + "」に一致する記憶を削除したよ！";
}

function addMemory(text) {
  const oldMemory = memoryBox.value.trim();
  const lines = oldMemory.split("\n");

  if (lines.some(line => line.includes(text))) {
    return "その内容はすでに記憶しているよ！";
  }

  memoryBox.value = oldMemory
    ? oldMemory + "\n・" + text
    : "【ユーザーの記憶】\n・" + text;

  saveMemory();
  return "記憶に追加したよ！";
}

function handleMemoryCommand(text) {
  let m;

  m = text.match(/^(.+?)を(.+?)に変更[して！。]*$/);
  if (m) {
    return changeMemory(m[1].trim(), m[2].trim());
  }

  m = text.match(
    /^(.+?)(?:の記憶)?を(?:忘れて|削除して|消して)[！。]*$/
  );
  if (m) {
    return deleteMemory(m[1].trim());
  }

  m = text.match(/^記憶から(.+?)を(?:削除|消して)[！。]*$/);
  if (m) {
    return deleteMemory(m[1].trim());
  }

  m = text.match(
    /^(?:俺|僕|私|自分)?(?:は)?(.+?)が好き(?:です|だよ|だね|だ)?[！。]*$/
  );
  if (m && m[1].trim() && m[1].trim().length <= 40) {
    return addMemory("好きなもの：" + m[1].trim());
  }

  m = text.match(
    /^(?:俺|僕|私|自分)の好きな(食べ物|飲み物|色|動物|ゲーム|趣味)は(.+?)(?:です|だよ|だね|だ)?[！。]*$/
  );
  if (m) {
    return addMemory("好きな" + m[1] + "：" + m[2].trim());
  }

  m = text.match(/^(?:これを)?(?:覚えて|記憶して|忘れないで)[：:\s]*(.+)$/);
  if (m) {
    return addMemory(m[1].trim());
  }

  return "";
}

loadBtn.onclick = async () => {
  if (engine) return;

  loadBtn.disabled = true;
  statusBox.textContent = "AIを起動中…初回は時間がかかるよ。";

  try {
    engine = await CreateMLCEngine(MODEL, {
      initProgressCallback: p => {
        statusBox.textContent = p.text || "AIを準備中…";
      }
    });

    statusBox.textContent = "AI起動完了！話しかけてね。";
    loadBtn.textContent = "AI起動済み";
  } catch (e) {
    statusBox.textContent = "起動失敗：" + e.message;
    loadBtn.disabled = false;
  }
};

async function sendMessage() {
  const text = questionBox.value.trim();
  if (!text) return;

  if (!engine) {
    statusBox.textContent = "先に「AIを起動する」を押してね。";
    return;
  }

  questionBox.value = "";
  showMessage("user", text);
  messages.push({ role: "user", content: text });
  saveHistory();
  sendBtn.disabled = true;

  const result = handleMemoryCommand(text);

  if (result) {
    showMessage("assistant", result);
    messages.push({ role: "assistant", content: result });
    saveHistory();
    sendBtn.disabled = false;
    return;
  }

  if (/保存されている記憶|保存した記憶|記憶を教えて|覚えていること/.test(text)) {
    const answer = memoryBox.value.trim() || "まだ記憶はないよ。";
    showMessage("assistant", answer);
    messages.push({ role: "assistant", content: answer });
    saveHistory();
    sendBtn.disabled = false;
    return;
  }

  try {
    const systemPrompt =
      "あなたはユーザー専用の日本語AIです。" +
      "自然で分かりやすく回答してください。" +
      "必要に応じてユーザーを「相棒」と呼んでください。" +
      "操作案内は一度に一つずつ説明してください。" +
      "\n保存されている記憶：\n" +
      (memoryBox.value.trim() || "まだ記憶はありません。");

    const response = await engine.chat.completions.create({
      messages: [
        { role: "system", content: systemPrompt },
        ...messages.slice(-10)
      ],
      temperature: 0.7,
      max_tokens: 256
    });

    const answer =
      response.choices[0]?.message?.content ||
      "うまく回答できなかったよ。";

    showMessage("assistant", answer);
    messages.push({ role: "assistant", content: answer });
    saveHistory();

  } catch (e) {
    const errorText = "エラーが発生したよ：" + e.message;
    showMessage("assistant", errorText);
    messages.push({ role: "assistant", content: errorText });
    saveHistory();
  }

  sendBtn.disabled = false;
}

sendBtn.onclick = sendMessage;

questionBox.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

document.getElementById("clearBtn").onclick = () => {
  messages = [];
  chatBox.replaceChildren();
  saveHistory();
  statusBox.textContent = "会話履歴を消去したよ。記憶は残っているよ。";
};
</script>
</body>
</html>
