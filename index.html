<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Free AI</title>
<style>
body {
  font-family: sans-serif;
  max-width: 800px;
  margin: auto;
  padding: 16px;
  background: #f4f6f8;
  color: #222;
}
h1 { font-size: 25px; }
section {
  background: white;
  padding: 14px;
  margin: 14px 0;
  border-radius: 12px;
}
button {
  padding: 11px 14px;
  margin: 4px 2px;
  border: 0;
  border-radius: 8px;
  background: #2463eb;
  color: white;
  font-size: 15px;
}
button:disabled { opacity: .5; }
textarea, input {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
}
#chat {
  min-height: 120px;
  max-height: 400px;
  overflow-y: auto;
}
.msg {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #eee;
  padding: 12px;
  border-radius: 9px;
  margin: 9px 0;
}
.msg.user { background: #dceaff; }
.small { color: #666; font-size: 13px; }
</style>
</head>
<body>

<h1>My Free AI</h1>
<p>自分専用・無料のローカルAI</p>

<section>
  <h2>AIモデル</h2>
  <button id="load">AIモデルを読み込む</button>
  <p id="status">まだ読み込まれていません。</p>
  <p id="progress" class="small"></p>
</section>

<section>
  <h2>長期記憶</h2>
  <p class="small">
    AIに覚えてほしいことを保存します。
    このブラウザ内に保存されます。
  </p>
  <textarea id="memory" rows="7"
    placeholder="例：回答は一度に一つずつ案内してほしい。"></textarea>
  <button id="saveMemory">記憶を保存</button>
  <p id="memoryStatus" class="small"></p>
</section>

<section>
  <h2>会話</h2>
  <div id="chat"></div>
  <textarea id="question" rows="3"
    placeholder="AIに質問する"></textarea>
  <button id="send">送信</button>
  <button id="new">新しいチャット</button>
  <button id="showHistory">過去の会話</button>
  <div id="history"></div>
</section>

<script type="module">
import { CreateMLCEngine } from
"https://esm.run/@mlc-ai/web-llm";

const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
const $ = id => document.getElementById(id);

let engine = null;
let messages = [];
let busy = false;

function read(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch {
    return fallback;
  }
}

function write(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

$("memory").value = localStorage.getItem("myai-memory") || "";
messages = read("myai-current-chat", []);
render();

function render() {
  $("chat").replaceChildren();

  for (const message of messages) {
    if (message.role === "system") continue;

    const div = document.createElement("div");
    div.className =
      "msg " + (message.role === "user" ? "user" : "");

    div.textContent =
      (message.role === "user" ? "あなた\n" : "AI\n")
      + message.content;

    $("chat").append(div);
  }

  $("chat").scrollTop = $("chat").scrollHeight;
}

function saveChat() {
  write("myai-current-chat", messages);
}

$("saveMemory").onclick = () => {
  localStorage.setItem("myai-memory", $("memory").value);
  $("memoryStatus").textContent = "記憶を保存しました。";
};

$("load").onclick = async () => {
  if (engine) return;

  $("load").disabled = true;
  $("status").textContent = "AIモデルを準備中…";

  try {
    engine = await CreateMLCEngine(MODEL, {
      initProgressCallback: report => {
        $("progress").textContent = report.text || "";
      }
    });

    $("status").textContent = "AIの準備ができました！";
    $("load").textContent = "読み込み済み";
  } catch (error) {
    $("status").textContent = "読み込み失敗：" + error.message;
    $("load").disabled = false;
  }
};

$("send").onclick = async () => {
  const text = $("question").value.trim();

  if (!text || busy) return;

  const memory = localStorage.getItem("myai-memory") || "";

  if (!engine && memory === "") {
    $("status").textContent =
      "先に「AIモデルを読み込む」を押してください。";
    return;
  }

  busy = true;
  $("send").disabled = true;
  $("question").value = "";

  messages.push({ role: "user", content: text });
  render();
  saveChat();

  try {
    let answer = "";

    // 保存された記憶を尋ねられたら、内容を直接返す
    const asksMemory =
      /記憶|覚えていること|覚えてること|保存内容|保存されている情報/
      .test(text);

    if (asksMemory) {
      answer = memory.trim()
        ? "保存されている記憶は以下のとおりです。\n\n" + memory
        : "まだ記憶は保存されていません。";
    } else {
      if (!engine) {
        throw new Error("先にAIモデルを読み込んでください。");
      }

      const system =
        "あなたはユーザー専用のAIアシスタントです。" +
        "日本語で親しみやすく、具体的に回答してください。" +
        "分からないことは正直に伝えてください。" +
        "操作案内は一度に一つの手順だけ説明してください。\n\n" +
        "以下はユーザーが保存した長期記憶です。" +
        "これはユーザーについての情報です。" +
        "質問に関係する場合は必ず参考にしてください。" +
        "記憶にない情報を作らないでください。\n\n" +
        "【保存された長期記憶】\n" +
        (memory.trim() || "現在、記憶はありません。");

      const result = await engine.chat.completions.create({
        messages: [
          { role: "system", content: system },
          ...messages.slice(-12)
        ],
        temperature: 0.5,
        max_tokens: 700
      });

      answer =
        result.choices[0].message.content ||
        "回答を生成できませんでした。";
    }

    messages.push({ role: "assistant", content: answer });

  } catch (error) {
    messages.push({
      role: "assistant",
      content: "エラー：" + error.message
    });
  }

  saveChat();
  render();
  busy = false;
  $("send").disabled = false;
};

$("new").onclick = () => {
  if (messages.length) {
    const history = read("myai-history", []);

    history.unshift({
      date: new Date().toLocaleString("ja-JP"),
      messages: messages
    });

    write("myai-history", history.slice(0, 30));
  }

  messages = [];
  saveChat();
  render();
  $("history").replaceChildren();
};

$("showHistory").onclick = () => {
  const history = read("myai-history", []);
  $("history").replaceChildren();

  history.forEach((item, index) => {
    const button = document.createElement("button");
    button.textContent = (index + 1) + ". " + item.date;

    button.onclick = () => {
      messages = item.messages || [];
      saveChat();
      render();
    };

    $("history").append(button);
  });
};
</script>
</body>
</html>
