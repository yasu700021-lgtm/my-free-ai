
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相棒AI</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: #f3f5f8; color: #222;
  font-family: sans-serif;
}
main { max-width: 700px; margin: auto; }
h1 { text-align: center; }
.panel {
  background: white; padding: 14px;
  margin-bottom: 14px; border-radius: 12px;
}
button, textarea { font: inherit; border-radius: 8px; padding: 11px; }
button { cursor: pointer; border: 0; background: #2563eb; color: white; }
button:disabled { opacity: .5; }
textarea {
  width: 100%; border: 1px solid #ccd1da;
  resize: vertical;
}
#chat {
  height: 320px; overflow-y: auto; background: white;
  padding: 12px; border-radius: 10px; border: 1px solid #ddd;
}
.message {
  white-space: pre-wrap; overflow-wrap: anywhere;
  padding: 10px 12px; border-radius: 10px;
  margin: 8px 0; line-height: 1.5;
}
.user { background: #dbeafe; margin-left: 12%; }
.assistant { background: #eee; margin-right: 8%; }
.row { display: flex; gap: 8px; margin-top: 8px; }
.row textarea { flex: 1; min-width: 0; }
#status { font-size: 14px; color: #555; white-space: pre-wrap; }
.small { font-size: 13px; color: #666; }
</style>
</head>
<body>
<main>
<h1>相棒AI</h1>

<section class="panel">
  <button id="startBtn">AIを起動する</button>
  <p id="status">AIはまだ起動していないよ。</p>
</section>

<section class="panel">
  <h3>相棒の記憶</h3>
  <textarea id="memoryBox" rows="5"
    placeholder="覚えておいてほしいこと（1行に1つ）"></textarea>
  <div class="row">
    <button id="saveMemoryBtn">記憶を保存</button>
  </div>
</section>

<section class="panel">
  <h3>会話</h3>
  <div id="chat"></div>
  <div class="row">
    <textarea id="questionBox" rows="2"
      placeholder="相棒AIに話しかけよう"></textarea>
    <button id="sendBtn" disabled>送信</button>
  </div>
  <div class="row">
    <button id="clearBtn" style="background:#b91c1c">
      会話履歴を消す
    </button>
  </div>
  <p class="small">会話履歴を消しても記憶は残るよ。</p>
</section>
</main>

<script type="module">
import { CreateMLCEngine } from
  "https://esm.run/@mlc-ai/web-llm";

const MODEL = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
const MEMORY_KEY = "myai-memory";
const HISTORY_KEY = "myai-history";

const startBtn = document.getElementById("startBtn");
const sendBtn = document.getElementById("sendBtn");
const questionBox = document.getElementById("questionBox");
const memoryBox = document.getElementById("memoryBox");
const chatBox = document.getElementById("chat");
const statusBox = document.getElementById("status");

let engine = null;
let busy = false;
let messages = [];

function readMemory() {
  return localStorage.getItem(MEMORY_KEY) || "";
}

function saveMemory(value) {
  localStorage.setItem(MEMORY_KEY, value);
  memoryBox.value = value;
}

function getMemoryLines() {
  return readMemory().split("\n").map(s => s.trim()).filter(Boolean);
}

function loadHistory() {
  try {
    const data = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    return Array.isArray(data)
      ? data.filter(m =>
          m && ["user", "assistant"].includes(m.role) &&
          typeof m.content === "string")
      : [];
  } catch {
    return [];
  }
}

function saveHistory() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
  } catch {
    statusBox.textContent = "履歴を保存できなかったよ。";
  }
}

function showMessage(role, content) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent =
    (role === "user" ? "あなた：\n" : "相棒AI：\n") + content;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addMessage(role, content) {
  messages.push({ role, content });
  saveHistory();
  showMessage(role, content);
}

function addMemory(line) {
  const lines = getMemoryLines();
  if (lines.includes(line)) return false;
  lines.push(line);
  saveMemory(lines.join("\n"));
  return true;
}

function forgetMemory(text) {
  const match = text.match(
    /^(.+?)の記憶を忘れて(?:ね)?$|^(.+?)を忘れて(?:ね)?$/
  );
  if (!match) return null;

  const target = (match[1] || match[2]).trim();
  const lines = getMemoryLines();
  const updated = lines.filter(line => !line.includes(target));

  if (updated.length === lines.length) {
    return "「" + target + "」の記憶は見つからなかったよ。";
  }

  saveMemory(updated.join("\n"));
  return "「" + target + "」の記憶を忘れたよ！";
}

function changeMemory(text) {
  const match = text.match(/^(.+?)を(.+?)に変更$/);
  if (!match) return null;

  const oldText = match[1].trim();
  const newText = match[2].trim();
  const lines = getMemoryLines();
  let changed = false;

  const updated = lines.map(line => {
    if (line.includes(oldText)) {
      changed = true;
      return line.replaceAll(oldText, newText);
    }
    return line;
  });

  if (!changed) return "変更する記憶が見つからなかったよ。";

  saveMemory(updated.join("\n"));
  return "記憶を変更したよ！";
}

function learnMemory(text) {
  let fact = null;

  if (/^.+?が(?:大好き|好き)$/.test(text)) {
    fact = text;
  } else {
    const match = text.match(/^覚えて(?:おいて|て)[:： ]?(.+)$/);
    if (match) fact = match[1].trim();
  }

  if (!fact) return null;

  return addMemory(fact)
    ? "「" + fact + "」を記憶に追加したよ！"
    : "そのことはもう記憶しているよ！";
}

function answerFromMemory(question) {
  const lines = getMemoryLines();
  if (!lines.length) return null;

  // 記憶一覧
  if (/何を覚えて|覚えていること|記憶の一覧|俺の記憶|私の記憶/.test(question)) {
    return "相棒について覚えていることだよ！\n" +
      lines.map(line => "・" + line).join("\n");
  }

  // 好きな食べ物
  if (/好きな食べ物|好きな料理|何が好き|何が大好き/.test(question)) {
    const food = lines.find(line =>
      /ラーメン|カレー|寿司|すし|焼肉|肉|魚|パスタ|そば|うどん|ピザ|ハンバーグ|オムライス/.test(line) &&
      /好き|大好き/.test(line)
    );

    if (food) {
      const item = food.replace(/が大好き$/, "").replace(/が好き$/, "");
      return "相棒の好きな食べ物は「" + item + "」だよ！";
    }
  }

  // 記憶に書かれたキーワードを質問文から探す
  const normalizedQuestion = question.replace(/[？?！!。]/g, "");

  for (const line of lines) {
    const item = line.replace(/が大好き$/, "").replace(/が好き$/, "");
    if (item.length >= 2 && normalizedQuestion.includes(item)) {
      return "それについては「" + line + "」と記憶しているよ！";
    }
  }

  return null;
}

function systemPrompt() {
  return `あなたは相棒専用の親しみやすいAIです。
日本語で自然に答えてください。
以下の記憶を回答に活用してください。
記憶にないことは、知っているふりをしないでください。

相棒の記憶：
${readMemory() || "まだ記憶はありません。"}`;
}

memoryBox.value = readMemory();
messages = loadHistory();
messages.forEach(m => showMessage(m.role, m.content));

document.getElementById("saveMemoryBtn").onclick = () => {
  saveMemory(memoryBox.value);
  statusBox.textContent = "記憶を保存したよ！";
};

startBtn.onclick = async () => {
  if (engine || busy) return;

  startBtn.disabled = true;
  statusBox.textContent = "AIを準備中だよ…";

  try {
    engine = await CreateMLCEngine(MODEL, {
      initProgressCallback: progress => {
        statusBox.textContent = progress.text || "AIを準備中…";
      }
    });
    statusBox.textContent = "起動できたよ！";
    sendBtn.disabled = false;
    startBtn.textContent = "AI起動済み";
  } catch (e) {
    statusBox.textContent = "起動エラー：" + e.message;
    startBtn.disabled = false;
  }
};

async function sendMessage() {
  const text = questionBox.value.trim();
  if (!text || busy) return;

  if (!engine) {
    statusBox.textContent = "先にAIを起動してね。";
    return;
  }

  questionBox.value = "";
  busy = true;
  sendBtn.disabled = true;
  addMessage("user", text);

  try {
    // 記憶操作・記憶からの回答をモデルより先に実行
    let answer =
      forgetMemory(text) ||
      changeMemory(text) ||
      learnMemory(text) ||
      answerFromMemory(text);

    if (!answer) {
      const result = await engine.chat.completions.create({
        messages: [
          { role: "system", content: systemPrompt() },
          ...messages.slice(-20)
        ],
        temperature: 0.5,
        max_tokens: 400
      });

      answer = result.choices?.[0]?.message?.content?.trim()
        || "ごめん、うまく答えられなかったよ。";
    }

    addMessage("assistant", answer);
    statusBox.textContent = "準備OK";
  } catch (e) {
    addMessage("assistant", "エラーが発生したよ：" + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = !engine;
  }
}

sendBtn.onclick = sendMessage;

questionBox.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById("clearBtn").onclick = () => {
  if (!confirm("会話履歴を消す？記憶は残るよ。")) return;
  messages = [];
  chatBox.replaceChildren();
  saveHistory();
  statusBox.textContent = "会話履歴を消去したよ。";
};
</script>
</body>
</html>
